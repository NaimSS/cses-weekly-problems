<!DOCTYPE html>
<!-- Source of ../og-image.png (link-preview image). Re-render with:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
       --window-size=1200,630 --screenshot=qoj/assets/og-image.png qoj/assets/og/card.html -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #fff; color: #111;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    display: flex; align-items: center; gap: 64px; padding: 0 80px; box-sizing: border-box;
    border-bottom: 14px solid #ed1d24;
  }
  .logo { height: 420px; flex: none; }
  .x { font-size: 64px; color: #bbb; font-weight: 300; flex: none; }
  .right { display: flex; flex-direction: column; gap: 18px; }
  .qoj { display: inline-flex; align-items: baseline; gap: 6px; }
  .qoj b { font-size: 150px; line-height: .9; font-weight: 800; letter-spacing: -4px; color: #0d6efd; }
  .qoj span { font-size: 48px; font-weight: 600; color: #6c757d; }
  .title { font-size: 52px; font-weight: 700; letter-spacing: -1px; }
  .sub { font-size: 30px; color: #555; line-height: 1.3; }
  .chips { display: flex; gap: 12px; margin-top: 6px; }
  .chips i { font-style: normal; font-size: 26px; font-weight: 700; padding: 6px 18px; border-radius: 999px; color: #fff; }
</style>
</head>
<body>
  <img class="logo" src="unicamp.svg" alt="">
  <div class="x">×</div>
  <div class="right">
    <div class="qoj"><b>QOJ</b><span>.ac</span></div>
    <div class="title">Premier Weekly</div>
    <div class="sub">Treino semanal de programação<br>competitiva da UNICAMP</div>
    <div class="chips">
      <i style="background:#198754">C</i><i style="background:#20c997">C2</i>
      <i style="background:#fd7e14">B</i><i style="background:#dc3545">B2</i>
    </div>
  </div>
</body>
</html>
