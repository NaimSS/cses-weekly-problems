name: Weekly Picks

on:
  schedule:
    - cron: '0 6 * * 0'   # every Sunday at 06:00 UTC
  workflow_dispatch:        # allow manual runs

concurrency:
  group: weekly-picks-push   # shared by weekly.yml and qoj-weekly.yml so their pushes don't race
  cancel-in-progress: false  # let the first run finish; don't drop scheduled work

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate weekly picks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python generate_html.py

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add weeks/ index.html all.html rank.html weeks_data.json processed.csv
          git diff --cached --quiet || git commit -m "chore: weekly picks $(date -u +%Y-%m-%d)"
          # Both Sunday workflows push to the same branch: rebase onto whatever landed first, retry.
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push attempt $i failed; retrying in $((i * 5))s"
            sleep $((i * 5))
          done
          echo "::error::could not push after 5 attempts"
          exit 1
