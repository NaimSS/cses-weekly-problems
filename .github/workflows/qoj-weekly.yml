name: QOJ Weekly Picks

on:
  schedule:
    - cron: '0 6 * * 0'   # every Sunday at 06:00 UTC
  workflow_dispatch:        # allow manual runs

concurrency:
  group: qoj-weekly-picks
  cancel-in-progress: false  # let the first run finish; don't drop scheduled work

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate QOJ weekly picks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python qoj/generate.py

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add qoj/
          git diff --cached --quiet || git commit -m "chore: qoj weekly picks $(date -u +%Y-%m-%d)"
          git push
